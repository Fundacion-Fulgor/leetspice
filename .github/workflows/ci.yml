name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest --tb=short

  migrations:
    name: migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leetspice
          POSTGRES_PASSWORD: leetspice
          POSTGRES_DB: leetspice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leetspice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -e '.'

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://leetspice:leetspice@localhost:5432/leetspice_test
        run: alembic upgrade head
