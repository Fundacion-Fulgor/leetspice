services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
      - isolated_worker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.prod.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # DB port is NOT exposed to the host for security.

  web:
    build:
      context: .
      dockerfile: Containerfile
    image: leetspice:prod
    command:
      - sh
      - -c
      - |
        # Seed challenges from image into the shared volume (only new ones)
        cp -rn /app/challenges-seed/* /app/challenges/ 2>/dev/null || true
        # Run migrations then start the app with multiple workers for concurrency
        alembic upgrade head && exec python -m uvicorn leetspice.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4} --proxy-headers --forwarded-allow-ips='*'
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      SECURE_COOKIES: "true"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      RUNNER_BACKEND: ${RUNNER_BACKEND:-ngspice}
      CHALLENGES_PATH: /app/challenges
      PDK_ROOT: /opt/IHP-Open-PDK
      PDK: ihp-sg13g2
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
    volumes:
      - challenges_data:/app/challenges

  worker:
    image: leetspice:prod
    command: ["leetspice-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://leetspice_worker:${WORKER_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      RUNNER_BACKEND: ${RUNNER_BACKEND:-ngspice}
      CHALLENGES_PATH: /app/challenges
      WORKER_DATA_DIR: /var/lib/leetspice
      PDK_ROOT: /opt/IHP-Open-PDK
      PDK: ihp-sg13g2
      LEETSPICE_JUDGE_TIMEOUT: ${LEETSPICE_JUDGE_TIMEOUT:-120}
      LEETSPICE_LAYOUT_TIMEOUT: ${LEETSPICE_LAYOUT_TIMEOUT:-300}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isolated_worker
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
          # pids: 256  # Requires cgroups v2 pids controller; enable on supported hosts
    volumes:
      - worker_data:/var/lib/leetspice
      - challenges_data:/app/challenges:ro

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
    depends_on:
      web:
        condition: service_healthy

networks:
  default:
  isolated_worker:
    internal: true

volumes:
  postgres_data:
  worker_data:
  challenges_data:
  caddy_data:
  caddy_config:
