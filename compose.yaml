services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leetspice}
      POSTGRES_USER: ${POSTGRES_USER:-leetspice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leetspice-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - default
      - isolated_worker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  web:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/leetspice:local
    command: ["sh", "-c", "alembic upgrade head && exec python -m uvicorn leetspice.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leetspice}:${POSTGRES_PASSWORD:-leetspice-local-only}@db:5432/${POSTGRES_DB:-leetspice}
      SECRET_KEY: ${SECRET_KEY:-replace-this-local-development-key}
      RUNNER_BACKEND: ${RUNNER_BACKEND:-ngspice}
      CHALLENGES_PATH: /app/challenges
      PDK_ROOT: /opt/IHP-Open-PDK
      PDK: ihp-sg13g2
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    image: localhost/leetspice:local
    command: ["leetspice-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-leetspice}:${POSTGRES_PASSWORD:-leetspice-local-only}@db:5432/${POSTGRES_DB:-leetspice}
      SECRET_KEY: ${SECRET_KEY:-replace-this-local-development-key}
      RUNNER_BACKEND: ${RUNNER_BACKEND:-ngspice}
      CHALLENGES_PATH: /app/challenges
      WORKER_DATA_DIR: /var/lib/leetspice
      PDK_ROOT: /opt/IHP-Open-PDK
      PDK: ihp-sg13g2
      LEETSPICE_JUDGE_TIMEOUT: ${LEETSPICE_JUDGE_TIMEOUT:-120}
      LEETSPICE_LAYOUT_TIMEOUT: ${LEETSPICE_LAYOUT_TIMEOUT:-300}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isolated_worker
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
          pids: 256
    volumes:
      - worker_data:/var/lib/leetspice

networks:
  default:
  isolated_worker:
    internal: true

volumes:
  postgres_data:
  worker_data:
