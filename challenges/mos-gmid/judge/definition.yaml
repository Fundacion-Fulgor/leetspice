version: 2
conditions:
  corner:
  - tt
  temperature:
  - 27
tests:
- name: functional
  template: judge/tests/functional.cir
  timeout: 30
  sweep:
    corner: all
    temperature: all
  measurements:
  - name: weak_current
    unit: A
    minimum: 1.0e-09
    maximum: 0.02
  - name: moderate_current
    unit: A
    minimum: 1.0e-09
    maximum: 0.02
  - name: strong_current
    unit: A
    minimum: 1.0e-09
    maximum: 0.02
  - name: weak_gmid
    unit: 1/V
    minimum: 0.1
    maximum: 40
  - name: moderate_gmid
    unit: 1/V
    minimum: 0.1
    maximum: 40
  - name: strong_gmid
    unit: 1/V
    minimum: 0.1
    maximum: 40
score:
  objectives:
  - measurement: moderate_gmid
    direction: maximize
    aggregation: mean
    normalization: 10
