version: 2
conditions:
  corner:
  - tt
  temperature:
  - 27
tests:
- name: functional
  template: judge/tests/functional.cir
  timeout: 30
  sweep:
    corner: all
    temperature: all
  measurements:
  - name: drain_current
    unit: A
    minimum: 1.0e-07
    maximum: 0.005
  - name: transconductance
    unit: S
    minimum: 1.0e-08
  - name: output_conductance
    unit: S
    minimum: 1.0e-10
  - name: output_resistance
    unit: ohm
    minimum: 1.0
  - name: gmid
    unit: 1/V
    minimum: 0.1
  - name: intrinsic_gain
    unit: V/V
    minimum: 1.0
score:
  objectives:
  - measurement: intrinsic_gain
    direction: maximize
    aggregation: mean
    normalization: 10.0
