version: 1
conditions:
  corner:
  - tt
  temperature:
  - 27
tests:
- name: functional
  template: judge/tests/functional.cir
  timeout: 30
  sweep:
    corner: all
    temperature: all
  measurements:
  - name: control_voltage
    unit: V
    minimum: 0
    maximum: 1.2
  - name: supply_current
    unit: A
    minimum: 0
    maximum: 0.05
score:
  strategy: efficiency
  measurement: control_voltage
  scale: 1.0e-06
  denominator: supply_current
