<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LeetSpice analog circuit design challenges">
  <title>{% block title %}LeetSpice{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=7">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <div class="scope-line" aria-hidden="true"></div>
  <header class="site-header">
    <div class="brand-group">
      <a class="brand" href="/"><span>LEET</span>SPICE <small>LAB // 01</small></a>
      <a class="fulgor-lockup" href="https://www.fundacionfulgor.org.ar/sitio/" aria-label="Fundación Fulgor" rel="external">
        <img src="{{ url_for('static', path='/fulgor-mark.png') }}" alt="">
        <span>A FULGOR FOUNDATION PROJECT</span>
      </a>
    </div>
    <nav aria-label="Main navigation">
      <a href="/">Challenges</a>
      <a href="/leaderboard">Leaderboard</a>
      {% if current_user %}
        <a href="/submissions">My submissions</a>
        <span class="identity">{{ current_user.display_name }}</span>
        <form method="post" action="/logout" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="nav-button">Log out</button>
        </form>
      {% else %}
        <a href="/login">Log in</a>
        <a class="nav-cta" href="/register">Create account</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><span>SPICE IN / SIGNAL OUT</span><a class="footer-fulgor" href="https://www.fundacionfulgor.org.ar/sitio/" rel="external"><img src="{{ url_for('static', path='/fulgor-mark.png') }}" alt="">A Fulgor Foundation project</a><span>BUILD · MEASURE · ITERATE</span></footer>
  <script>
    function activateResultTab(tab) {
      const tabs = [...tab.closest('[role="tablist"]').querySelectorAll(':scope > [role="tab"]')];
      for (const item of tabs) {
        const selected = item === tab;
        item.setAttribute('aria-selected', selected);
        item.tabIndex = selected ? 0 : -1;
        document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
      }
    }
    document.addEventListener('click', (event) => {
      const tab = event.target.closest('.pvt-results [role="tab"]');
      if (tab) activateResultTab(tab);
    });
    document.addEventListener('keydown', (event) => {
      const tab = event.target.closest('.pvt-results [role="tab"]');
      if (!tab || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      const tabs = [...tab.closest('[role="tablist"]').querySelectorAll(':scope > [role="tab"]')];
      const index = tabs.indexOf(tab);
      const next = event.key === 'Home' ? tabs[0] : event.key === 'End' ? tabs.at(-1) : tabs[(index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
      event.preventDefault();
      activateResultTab(next);
      next.focus();
    });
  </script>
</body>
</html>
