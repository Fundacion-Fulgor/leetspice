{% extends "base.html" %}
{% block title %}Log in · LeetSpice{% endblock %}
{% block content %}
<section class="auth-shell">
  <div><p class="eyebrow">Lab access</p><h1>Return to<br><em>the bench.</em></h1><p>Your designs and results are waiting.</p></div>
  <form method="post" class="panel form-panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h2>Log in</h2>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <label>Email<input type="email" name="email" required value="{{ email|default('') }}" autocomplete="email"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary">Log in</button>
    <p class="form-foot">Need an account? <a href="/register">Register</a></p>
  </form>
</section>
{% endblock %}
