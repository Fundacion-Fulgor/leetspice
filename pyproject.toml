[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leetspice"
version = "0.1.0"
description = "Gamified analog circuit design platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<24",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "markdown-it-py>=4,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sqladmin>=0.19,<1",
  "uvicorn[standard]>=0.32,<1",
  "itsdangerous>=2.1.0",
  "slowapi>=0.1.9,<1",
]

[project.optional-dependencies]
eda = ["klayout==0.30.3"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "mypy==2.4.0",
  "ruff==0.17.1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
leetspice-worker = "leetspice.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leetspice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# admin.py embeds large HTML/CSS templates in f-strings; wrapping them to
# 100 columns would hurt readability and risk altering the rendered markup.
"src/leetspice/admin.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
# klayout is an optional "eda" extra that CI does not install.
module = ["klayout", "klayout.*"]
ignore_missing_imports = true
